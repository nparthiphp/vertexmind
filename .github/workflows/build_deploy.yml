name: VertexMind - Build and Deploy Debug

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          lfs: false

      - name: Print Azure Static Web App Configuration
        run: |
          echo "=================================================="
          echo "AZURE STATIC WEB APP CONFIGURATION"
          echo "=================================================="

          echo "Web App Name       : VertexMind"
          echo "Resource Group     : rg-vertex-mind"
          echo "Location           : East Asia"
          echo "Hostname           : yellow-pond-032cf2900.7.azurestaticapps.net"
          echo "GitHub Repository  : nparthiphp/vertexmind"
          echo "Branch             : main"

          echo ""
          echo "Current Git Branch:"
          git branch --show-current

          echo ""
          echo "Current Commit:"
          git rev-parse HEAD

          echo ""
          echo "=================================================="
